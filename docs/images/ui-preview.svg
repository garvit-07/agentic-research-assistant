<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" font-family="system-ui,Segoe UI,sans-serif">
  <rect width="1000" height="560" rx="12" fill="#f3f5f7" stroke="#d9e0e6"/>
  <rect width="1000" height="34" rx="12" fill="#e7ecf0"/><rect y="20" width="1000" height="14" fill="#e7ecf0"/>
  <circle cx="20" cy="17" r="5" fill="#d9e0e6"/><circle cx="38" cy="17" r="5" fill="#d9e0e6"/><circle cx="56" cy="17" r="5" fill="#d9e0e6"/>
  <text x="500" y="22" font-size="12" fill="#5c6b78" text-anchor="middle">localhost:8000</text>

  <!-- sidebar -->
  <rect y="34" width="230" height="526" fill="#fff"/><path d="M230 34V560" stroke="#d9e0e6"/>
  <text x="20" y="68" font-size="17" font-weight="600" font-family="Georgia,serif" fill="#14212b">Research Assistant</text>
  <text x="20" y="88" font-size="11" fill="#5c6b78">Plans, searches, writes, then checks</text><text x="20" y="102" font-size="11" fill="#5c6b78">its own answer.</text>
  <rect x="20" y="120" width="190" height="34" rx="6" fill="#fff" stroke="#d9e0e6"/><text x="115" y="142" font-size="13" fill="#14212b" text-anchor="middle">New conversation</text>
  <text x="20" y="186" font-size="12" font-weight="600" fill="#5c6b78">Add a document</text>
  <rect x="20" y="196" width="190" height="30" rx="6" fill="#fff" stroke="#d9e0e6"/><text x="30" y="216" font-size="12" fill="#5c6b78">rag-notes.pdf</text>
  <text x="20" y="244" font-size="11" fill="#0f766e">rag-notes.pdf: 38 chunks indexed</text>
  <text x="20" y="530" font-size="11" fill="#5c6b78">Conversation 3f9a21c0</text>

  <!-- chat -->
  <g>
    <rect x="470" y="60" width="270" height="40" rx="10" fill="#d8f0ed"/>
    <text x="485" y="85" font-size="13" fill="#14212b">Compare RAG and fine-tuning for support bots</text>
    <g font-family="Georgia,serif" fill="#14212b">
      <text x="260" y="140" font-size="15" font-weight="700" font-family="system-ui">RAG vs fine-tuning for a support chatbot</text>
      <text x="260" y="172" font-size="15">Retrieval-augmented generation suits a support bot whose</text>
      <text x="260" y="194" font-size="15">knowledge changes often, because new articles are indexed</text>
      <text x="260" y="216" font-size="15">without retraining [1]. Fine-tuning is better for tone and</text>
      <text x="260" y="238" font-size="15">response format [2]. Most production systems combine both</text>
      <text x="260" y="260" font-size="15">approaches: tune for behaviour, retrieve for facts [1][3].</text>
      <text x="260" y="296" font-size="15" font-weight="700" font-family="system-ui">When each one wins</text>
      <text x="260" y="324" font-size="15">• Frequently updated policies: RAG</text>
      <text x="260" y="346" font-size="15">• Brand voice and fixed templates: fine-tuning</text>
      <text x="260" y="368" font-size="15">• Cited answers for auditors: RAG<tspan fill="#0f766e">▍</tspan></text>
    </g>
    <text x="260" y="410" font-size="12" fill="#5c6b78">Sources: rag-notes.pdf (page 2) · https://example.com/rag-vs-finetuning</text>
  </g>
  <rect x="250" y="478" width="400" height="44" rx="6" fill="#fff" stroke="#d9e0e6"/><text x="266" y="505" font-size="13" fill="#5c6b78">Ask a research question…</text>
  <rect x="662" y="478" width="52" height="44" rx="6" fill="#0f766e"/><text x="688" y="505" font-size="13" fill="#fff" text-anchor="middle">Ask</text>

  <!-- activity -->
  <rect x="730" y="34" width="270" height="526" fill="#fff"/><path d="M730 34V560" stroke="#d9e0e6"/>
  <text x="750" y="68" font-size="12" font-weight="600" fill="#5c6b78">Agent activity</text>
  <g font-size="13" fill="#14212b">
    <circle cx="756" cy="98" r="5" fill="#0f766e"/><text x="772" y="102">Planning</text>
    <text x="772" y="120" font-size="11" fill="#5c6b78">1. Find how RAG handles changing data</text>
    <text x="772" y="136" font-size="11" fill="#5c6b78">2. Find when fine-tuning is preferred</text>
    <path d="M745 150H985" stroke="#d9e0e6"/>
    <circle cx="756" cy="170" r="5" fill="#0f766e"/><text x="772" y="174">Researching</text>
    <circle cx="756" cy="198" r="5" fill="#0f766e"/><text x="772" y="202">Tool: search_documents</text>
    <circle cx="756" cy="226" r="5" fill="#0f766e"/><text x="772" y="230">Tool: web_search</text>
    <path d="M745 244H985" stroke="#d9e0e6"/>
    <circle cx="756" cy="264" r="5" fill="#0f766e"/><text x="772" y="268">Writing the answer</text>
    <circle cx="756" cy="296" r="5" fill="#b91c1c"/><text x="772" y="300">Checking its own answer</text>
    <text x="772" y="316" font-size="11" fill="#5c6b78">Score 6/10, sent back: claim [3] unsupported</text>
    <circle cx="756" cy="346" r="5" fill="#b45309"/><text x="772" y="350">Revising the answer</text>
  </g>
</svg>
